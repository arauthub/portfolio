# Google App Engine deployment configuration for Petit Maison Kids Wagtail Backend
runtime: python311
instance_class: F2

entrypoint: gunicorn -b :$PORT petit_backend.wsgi:application --workers 2 --threads 4 --timeout 90

env_variables:
  DJANGO_SETTINGS_MODULE: "petit_backend.settings.production"
  DJANGO_SECRET_KEY: "CHANGE_ME_SECRET_KEY_PRODUCTION_GOOGLE_APP_ENGINE"
  SECURE_SSL_REDIRECT: "True"
  STORAGE_BACKEND: "gcs"
  GS_BUCKET_NAME: "petit-maison-kids-media-bucket"
  DB_NAME: "petit_kids_production_db"
  DB_USER: "petit_kids_user"
  DB_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  CLOUD_SQL_CONNECTION_NAME: "PROJECT_ID:REGION:INSTANCE_NAME"
  ALLOWED_HOSTS: ".appspot.com,petitmaisonkids.com,www.petitmaisonkids.com"
  CSRF_TRUSTED_ORIGINS: "https://*.appspot.com,https://petitmaisonkids.com"
  STRIPE_PUBLIC_KEY: "pk_live_your_production_stripe_key"
  STRIPE_SECRET_KEY: "sk_live_your_production_stripe_key"
  PAYMENT_SANDBOX_MODE: "False"

beta_settings:
  cloud_sql_instances: "PROJECT_ID:REGION:INSTANCE_NAME"

handlers:
  - url: /static
    static_dir: staticfiles/
    secure: always

  - url: /.*
    script: auto
    secure: always

automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.65
