steps:
  # 1. Build Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/spatialcanvas-ai:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/spatialcanvas-ai:latest'
      - '.'

  # 2. Push Image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/spatialcanvas-ai:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'spatialcanvas-ai'
      - '--image=gcr.io/$PROJECT_ID/spatialcanvas-ai:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,VERTEX_AI_MODEL=gemini-2.0-flash'

images:
  - 'gcr.io/$PROJECT_ID/spatialcanvas-ai:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/spatialcanvas-ai:latest'

options:
  logging: CLOUD_LOGGING_ONLY

