version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: gmp_backend
    ports:
      - "8000:8000"
    environment:
      - GCP_PROJECT_ID=gmp-demo-project-569655961
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ../backend/app:/app/app

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: gmp_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

