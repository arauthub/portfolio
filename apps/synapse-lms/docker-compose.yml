version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synapse_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - synapse_db:/app/
      - ./backend/media:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=synapse_backend.settings.production
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=*
      - CORS_ALLOW_ALL=True
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/courses/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: synapse_frontend
    restart: always
    ports:
      - "80:80"
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  synapse_db:
