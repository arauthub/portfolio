name: CI / Monorepo Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  presubmit-audit:
    name: Security & Architecture Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Run Presubmit Security & Sync Audit
        run: |
          chmod +x scripts/presubmit.py
          python3 scripts/presubmit.py --mode=pre-commit

  myagents-tests:
    name: Multi-Agent Swarm Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          cd agents/myagents
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Multi-Agent Unit & Integration Tests
        run: |
          cd agents/myagents
          python -m unittest discover -s tests -p "test_*.py"

  arnas-server-tests:
    name: ARNAS Cloud NAS Server Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: arnas_admin
          POSTGRES_PASSWORD: change_this_secret_password
          POSTGRES_DB: arnas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Server Tests
        env:
          DATABASE_URL: postgresql://arnas_admin:change_this_secret_password@localhost:5432/arnas_db?schema=public
          JWT_SECRET: arnas_super_secret_jwt_key_default_32chars_min
          JWT_REFRESH_SECRET: arnas_super_secret_refresh_jwt_key_32chars_min
        run: |
          cd apps/arnas/server
          npm install
          npx prisma db push --skip-generate
          npm test

  workspace-curator-tests:
    name: WorkspaceCurator Webhook & Curation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          cd apps/workspace-curator
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run WorkspaceCurator Unit & Integration Tests
        run: |
          cd apps/workspace-curator
          python -m unittest discover -s tests -p "test_*.py"

  jamstack-frontend-tests:
    name: Nexus Prime Jamstack Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Jamstack Unit & Structure Tests
        run: |
          cd apps/jamstack-frontend
          npm test
          npm run build

  synapse-lms-build:
    name: Synapse LMS Build & Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Synapse LMS Frontend
        run: |
          cd apps/synapse-lms/frontend
          npm install
          npm run build

